[package]
name = "codex-voice"
version = "0.1.2"
edition = "2021"
rust-version = "1.98"
description = "Unofficial transcription and realtime voice server using a Codex login"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dmmeteo/codex-voice"
homepage = "https://github.com/dmmeteo/codex-voice"
keywords = ["codex", "voice", "speech", "transcription", "webrtc"]
categories = ["command-line-utilities", "api-bindings"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"

[features]
default = ["server", "realtime"]
server = ["dep:axum", "dep:tokio"]
realtime = ["dep:wreq", "dep:wreq-util", "dep:uuid", "dep:futures-util", "dep:tokio-tungstenite", "dep:tokio"]

[dependencies]
axum = { version = "0.8.7", features = ["multipart", "ws"], optional = true }
base64 = "0.22.1"
clap = { version = "4.5.51", features = ["derive"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync"], optional = true }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
wreq = { version = "=0.16.0", features = ["json", "multipart", "stream"], optional = true }
wreq-util = { version = "=0.2.0", optional = true }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
