name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo test --all-targets --all-features
      - run: cargo check --no-default-features --all-targets
      - run: cargo check --no-default-features --features server --all-targets
      - run: cargo check --no-default-features --features realtime --all-targets
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: cargo package --allow-dirty
